<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>웹 메모장</title>
    <link rel="shortcut icon" href="./memo_favicon.ico" >
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=IBM+Plex+Sans+KR:wght@400;600&family=Nanum+Gothic:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Nanum+Square+Round:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* [기본 스타일] 라이트 모드 기준의 배경 및 레이아웃 설정 */
        body {
            background-color: #f4f5f7;
            background: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRZQGJwls4ovjuHlqQkbDpJG5g9vBkShB0xaZtFaaTJ2c5p0QgRCEdamGA7&s=10) no-repeat center center fixed;
            -webkit-background-size: cover;
            -moz-background-size: cover;
            -o-background-size: cover;
            background-size: cover;
            margin: 0;
            padding: 30px 0;
            font-family: sans-serif;
            position: relative;
            transition: background 0.3s ease;
        }
        /* [오버레이] 밝은 배경용 은은한 막 처리 */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            transition: background-color 0.3s ease;
        }
        /* [레이아웃 래퍼] 전체 영역을 좌우 2분할(목록/에디터)하기 위한 플렉스 박스 */
        #wrapper { width: 80%; margin: 0 auto; display: flex; gap: 20px; box-sizing: border-box; }
        /* [글 목록 영역] 저장된 메모 목록과 불러오기 버튼이 위치하는 좌측 패널 */
        #list {
            background-color: #e9ecef; width: 220px; flex-shrink: 0;
            border: 1px solid #dcedc8; padding: 10px; box-sizing: border-box; border-radius: 6px;
        }
        /* [구분선] 목록과 메뉴를 시각적으로 나누는 바 */
        .divider { border: none; height: 2px; background-color: #4c6ef5; margin: 12px 0; border-radius: 2px; }
        #list h3 { text-align: center; color: #495057; }
        /* [개별 메모 아이템] 목록에 표시되는 각각의 글 제목 디자인 */
        .item {
            padding: 8px; margin-bottom: 5px; background: #ffffff;
            border: 1px solid #e0e0e0; border-radius: 4px; cursor: pointer;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #333;
        }
        .item:hover { background: #f1f3f5; }
        /* [우측 에디터 영역] 툴바, 제목, 내용 입력창을 세로로 배치하는 영역 */
        #editor { display: flex; flex-direction: column; gap: 10px; flex: 1; }
        .top-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .height-control-group { display: flex; align-items: center; gap: 6px; font-size: 14px; color: #495057; }
        /* [공통 버튼 스타일] 상단 툴바의 글꼴, 크기 조절 및 테마/색상 버튼 디자인 */
        .font-btn {
            padding: 4px 8px; cursor: pointer; font-size: 12px;
            background-color: #ffffff; border: 1px solid #ced4da; border-radius: 4px; color: #495057;
        }
        .font-btn:hover { background-color: #e9ecef; }
        /* [입력창 스타일] 제목과 내용 입력 칸의 기본 라이트 모드 디자인 */
        #titleInput, #contentInput {
            font-size: 16px; font-family: inherit; padding: 12px; box-sizing: border-box;
            background-color: #fcfbf9; border: 1px solid #dcd6cd; border-radius: 6px; color: #212529; outline: none;
        }
        #titleInput:focus, #contentInput:focus { border-color: #748ffc; box-shadow: 0 0 0 2px rgba(116, 143, 252, 0.15); }
        /* [본문 입력창 크기] 세로 크기 조절 기능 유지 */
        #contentInput { height: 70vh !important; min-height: 100px; flex: none !important; resize: vertical; }
        /* [하단 버튼 영역] 저장, 초기화, 다운로드 버튼 그룹 디자인 */
        #list button, .button-group button {
            width: 100%; padding: 8px; margin-bottom: 10px; cursor: pointer;
            background-color: #ffffff; border: 1px solid #ced4da; border-radius: 4px; font-weight: bold; color: #495057;
        }
        .button-group { display: flex; gap: 10px; }
        .button-group button { flex: 1; }
        #list button:hover, .button-group button:hover { background-color: #e9ecef; }

		
        /* [다크 모드 전체 적용] body에 dark-mode 클래스가 추가될 때의 스타일 변환 */
        body.dark-mode::before { background-color: rgba(0, 0, 0, 0.8); }
        body.dark-mode #list { background-color: #1e1e1e; border-color: #333333; }
        body.dark-mode #list h3 { color: #e0e0e0; }
        body.dark-mode .divider { background-color: #3b5bdb; }
        body.dark-mode .item { background: #252526; border-color: #333333; color: #d4d4d4; }
        body.dark-mode .item:hover { background: #2a2d2e; color: #ffffff; }
        body.dark-mode .height-control-group { color: #b0b0b0; }
        body.dark-mode .font-btn, body.dark-mode #list button, body.dark-mode .button-group button {
            background-color: #252526; border-color: #333333; color: #d4d4d4;
        }
        body.dark-mode .font-btn:hover, body.dark-mode #list button:hover, body.dark-mode .button-group button:hover {
            background-color: #2a2d2e;
        }
        /* [다크 모드 입력창] 제목 및 내용 입력창의 어두운 테마 색상 지정 */
        body.dark-mode #titleInput, body.dark-mode #contentInput {
            background-color: #1e1e1e; border-color: #333333; color: #e0e0e0;
        }
        /* [다크 모드 캐시 비우기 버튼] 독립 ID를 가진 캐시 비우기 버튼의 다크 모드 색상 */
        body.dark-mode #clearchache {
            background-color: #252526; color: #ff8787; border-color: #552222;
        }
        body.dark-mode #clearchache:hover { background-color: #3a2222; }

/*******************************************************************************************************************/

		@property --rotation {
		  syntax: '<angle>';
		  inherits: false;
		  initial-value: 0deg;
		}

		/* 제목 입력부 전용으로 조정된 .gemini 클래스 */
		.gemini {
		  --border-size: 4px;
		  --gradient: conic-gradient(from var(--rotation) at 52% 49% in oklab, oklch(0.63 0.2 251.22) 27%, oklch(0.67 0.21 25.81) 33%, oklch(0.9 0.19 93.93) 41%, oklch(0.79 0.25 150.49) 49%, oklch(0.63 0.2 251.22) 65%, oklch(0.72 0.21 150.89) 93%, oklch(0.63 0.2 251.22));
		  animation: rotate 3s infinite linear;
		  border-radius: 1.25rem; /* 입력창 크기에 맞게 조절 가능 */
		  background: none;
		  position: relative;
		  padding: 0;
		  width: 100%;
		  max-width: 500px; /* 원하는 너비 설정 */
		  margin-bottom: 1rem;
		  
		  &::after {
			content: '';
			position: absolute;
			display: block;
			width: 100%;
			height: 100%;
			background: var(--gradient);
			top: 50%;
			left: 50%;
			translate: -50% -50%;
			z-index: -1;
			animation: rotate 5s infinite linear;
			filter: blur(15px);
		  }
		  
		  .inner {
			background: light-dark(white, #1a1c1e);
			color: light-dark(#222, hsl(210, 8%, 66%));
			padding: 0.001rem 0.001rem;
			position: relative;
			z-index: 2;
			border-radius: inherit;
			display: flex; /* 그리드 대신 플렉스로 변경하여 input이 꽉 차게 함 */
			align-items: center;
			font-family: system-ui;
		  }

		  .border {
			position: absolute;
			inset: calc(var(--border-size) * -1);
			mask: linear-gradient(white);
			border-radius: inherit;
			overflow: hidden;

			&::after {
			  content: '';
			  position: absolute;
			  width: 100%;
			  height: 100%;
			  background: var(--gradient);
			  top: 50%;
			  left: 50%;
			  translate: -50% -50%;
			  z-index: -1;
			  filter: blur(5px);
			}
		  }
		  
		  input {
			width: 100%;
			color: light-dark(#222, hsl(210, 8%, 66%));
			background: none;
			border: none;
			font-size: 1rem;
			font-family: system-ui;
			font-weight: 300;
			
			&:focus {
			  outline: none;
			}
			
			&:not(:placeholder-shown) {
			  color: light-dark(black, white);
			}
		  }
		}

		@keyframes rotate {
		  to {
			--rotation: 360deg;
		  }
		}

    </style>
</head>
<body class="dark-mode">
    <div id="wrapper">
        <!-- [좌측 패널] 글 목록 및 파일 로드 컨트롤 구역 -->
        <div id="list">
            <h3>🔢 글 목록</h3>
            <button onclick="newItem()" title="닫으면 기록은 사라짐. PC에 저장부터 하세요.">+ 📝 새 글 작성</button>
            <select id="fileExtensionFilter" onchange="changeFileAccept()" style="background-color:#CCC; width: 100%; padding: 6px; margin-bottom: 8px; border-radius: 4px; border: 1px solid #ced4da; font-size: 13px; box-sizing: border-box;">
                <option value="all">모든 파일 (*.*)</option>
                <option value=".txt">텍스트 파일 (.txt)</option>
                <option value=".ini">설정 파일 (.ini)</option>
                <option value=".cfg">구성 파일 (.cfg)</option>
                <option value=".dat">데이터 파일 (.dat)</option>
            </select>
            <button onclick="openFileExplorer()">+ 📂 파일 불러오기</button>
            <hr class="divider">
            <input type="file" id="fileLoader" multiple style="display: none;" onchange="loadLocalFiles(event)">
            <div id="itemContainer"></div>
        </div>
        <!-- [우측 패널] 에디터 툴바, 입력창, 저장 및 기능 버튼 구역 -->
        <div id="editor">
            <div class="top-toolbar">
                <div class="height-control-group">
                    <span>에디터 높이:</span>
                    <button onclick="changeEditorHeight(-5)">- 작게</button>
                    <button onclick="changeEditorHeight(5)">+ 크게</button>
                </div>
                <div class="top-toolbar">
                    <div class="editor-header"></div>
                    <button id="themeToggleBtn" class="font-btn" onclick="toggleTheme()">☀️ 전환</button>
                    <!-- [색상 검색 버튼] 클릭 시 구글에서 색상 코드를 새 탭으로 검색 -->&emsp;
                    <button class="font-btn" onclick="openColorSearch()">색</button>
                </div>
                <div class="editor-header">
                    <select id="fontSelect" class="font-btn" onchange="changeFont()">
                        <option value="sans-serif">기본 고딕 (Sans-serif)</option>
                        <option value="'Nanum Myeongjo', serif">나눔명조 (차분한 바탕체)</option>
                        <option value="'Pretendard', sans-serif">프리텐다드 (Pretendard)</option>
                        <option value="'Malgun Gothic', sans-serif">맑은 고딕</option>
                        <option value="'Nanum Gothic', sans-serif">나눔고딕</option>
                        <option value="'D2Coding', monospace">D2코딩 (코딩용)</option>
                    </select>
                </div>
                <div class="editor-header">
                    <span style="font-size: 12px; color: #6c757d; margin-right: 5px;">글자크기:</span>
                    <button class="font-btn" onclick="changeFontSize(-2)">-</button>
                    <button class="font-btn" onclick="resetFontSize()">기본</button>
                    <button class="font-btn" onclick="changeFontSize(2)">+</button>
                </div>
            </div>
			
            <!-- [텍스트 입력 컨트롤] 제목과 본문 입력 필드
			 <input type="text" id="titleInput" placeholder="제목을 입력하세요"> -->
			<div class="gemini gemini-title-box">
				<div class="inner">
					<input type="text" id="titleInput" placeholder="제목을 입력하세요" style="border-radius: 1.25rem;">
				</div>
				<div class="border"></div>
			</div>
			
             <textarea id="contentInput" placeholder="내용을 입력하세요"></textarea>


            <div class="button-group">
                <button onclick="saveNote()">〓 저장하기 (캐시에 임시 저장)</button>
                <button onclick="clearCache()" id="clearchache">🗑️ 캐시 비우기 (메모 초기화)</button>
                <button onclick="downloadTxtFile()">💾 PC에 제목.txt 로저장 (다운로드)</button>
                <button onclick="closeWindow()" style="padding: 4px 8px; font-size: 12px; flex: 0.5; background-color: #f8f9fa; color: #495057; border-color: #ced4da;">❌ 창 닫기</button>
            </div>
        </div>
    </div>    
	
	
	<script>
        /* [데이터 초기화] 로컬스토리지에서 저장된 메모 목록 불러오기 */
        let notes = JSON.parse(localStorage.getItem('web_notes')) || [];
        let currentIndex = null;
        let currentFontSize = 16;
        /* [마우스 휠 이벤트] 에디터 바깥 영역에서 휠 조작 시 글자 크기 조절 기능 */
        document.getElementById('editor').addEventListener('wheel', function(event) {
            const contentInput = document.getElementById('contentInput');
            if (event.target === contentInput) return;
            event.preventDefault();
            if (event.deltaY < 0) { changeFontSize(2); } else { changeFontSize(-2); }
        }, { passive: false });
        /* [페이지 로드 이벤트] 저장된 테마 상태와 폰트 설정을 불러와 화면에 적용 */
        window.addEventListener('DOMContentLoaded', () => {
            const body = document.body;
            const themeBtn = document.getElementById('themeToggleBtn');
            const fontSelect = document.getElementById('fontSelect');
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                body.classList.remove('dark-mode');
                if (themeBtn) themeBtn.innerText = '🌙 전환';
            } else {
                body.classList.add('dark-mode');
                if (themeBtn) themeBtn.innerText = '☀️ 전환';
            }
            const savedFont = localStorage.getItem('selectedFont');
            if (savedFont && fontSelect) {
                body.style.fontFamily = savedFont;
                fontSelect.value = savedFont;
            }
        });
        /* [테마 토글 함수] 라이트 모드와 다크 모드를 서로 전환하고 상태를 저장 */
        function toggleTheme() {
            const body = document.body;
            const btn = document.getElementById('themeToggleBtn');
            body.classList.toggle('dark-mode');
            if (body.classList.contains('dark-mode')) {
                btn.innerText = '☀️ 전환';
                localStorage.setItem('theme', 'dark');
            } else {
                btn.innerText = '🌙 전환';
                localStorage.setItem('theme', 'light');
            }
        }
        /* [색상 검색 링크 함수] '색' 버튼 클릭 시 구글 검색 결과 페이지를 새 탭으로 오픈 */
        function openColorSearch() {
            window.open('https://www.google.com/search?q=%23fcfbf9&ie=UTF-8','_blank');
        }
        /* [폰트 변경 함수] 선택한 폰트를 전체 문서에 적용하고 저장 */
        function changeFont() {
            const fontSelect = document.getElementById('fontSelect');
            const selectedFont = fontSelect.value;
            document.body.style.fontFamily = selectedFont;
            localStorage.setItem('selectedFont', selectedFont);
        }
        /* [캐시 비우기 함수] 로컬스토리지의 메모 데이터를 모두 삭제하고 입력창 초기화 */
        function clearCache() {
            if (confirm('저장된 모든 캐시(메모 목록)를 삭제하시겠습니까?\\n(PC에 다운로드한 파일은 유지됩니다)')) {
                localStorage.removeItem('web_notes');
                notes = [];
                currentIndex = null;
                document.getElementById('titleInput').value = '';
                document.getElementById('contentInput').value = '';
                renderList();
            }
        }
        /* [파일 확장자 필터 함수] 파일 탐색기에서 선택할 수 있는 확장자 제한 설정 */
        function changeFileAccept() {
            const select = document.getElementById('fileExtensionFilter');
            const fileInput = document.getElementById('fileLoader');
            const selectedVal = select.value;
            if (selectedVal === 'all') { fileInput.removeAttribute('accept'); }
            else { fileInput.setAttribute('accept', selectedVal); }
        }
        /* [파일 탐색기 열기 함수] 숨겨진 파일 입력창을 프로그래밍 방식으로 실행 */
        function openFileExplorer() { document.getElementById('fileLoader').click(); }
        /* [로컬 파일 로드 함수] 사용자가 선택한 파일을 읽어와서 메모 목록에 추가 */
        function loadLocalFiles(event) {
            const files = event.target.files;
            if (!files.length) return;
            const fileCount = files.length;
            Array.from(files).forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const content = e.target.result;
                    let fileName = file.name;
                    let lastDotIndex = fileName.lastIndexOf('.');
                    let title = lastDotIndex !== -1 ? fileName.substring(0, lastDotIndex) : fileName;
                    let extension = lastDotIndex !== -1 ? fileName.substring(lastDotIndex + 1).toLowerCase() : '';
                    notes.push({ title: title, content: content, ext: extension });
                    localStorage.setItem('web_notes', JSON.stringify(notes));
                    renderList();
                    if (index === 0) { selectNote(notes.length - fileCount); }
                };
                reader.readAsText(file, 'utf-8');
            });
            event.target.value = '';
        }
        /* [에디터 높이 조절 함수] 본문 입력창의 세로 크기를 뷰포트(vh) 기준으로 조절 */
        function changeEditorHeight(amount) {
            const editor = document.getElementById('contentInput');
            if (!editor) return;
            let currentVh = 70;
            if (editor.style.height && editor.style.height.includes('vh')) {
                currentVh = parseInt(editor.style.height);
            } else {
                currentVh = Math.round((editor.offsetHeight / window.innerHeight) * 100);
            }
            let newVh = currentVh + amount;
            if (newVh < 20) newVh = 20;
            if (newVh > 90) newVh = 90;
            editor.style.setProperty('height', newVh + 'vh', 'important');
            editor.style.minHeight = newVh + 'vh';
        }
        /* [목록 렌더링 함수] 저장된 메모 배열을 기반으로 좌측 패널에 목록 생성 */
        function renderList() {
            const container = document.getElementById('itemContainer');
            container.innerHTML = '';
            notes.forEach((note, index) => {
                const div = document.createElement('div');
                div.className = 'item';
                div.textContent = note.title || `제목없음 ${index + 1}`;
                div.onclick = () => selectNote(index);
                container.appendChild(div);
            });
        }
        /* [새 글 작성 함수] 에디터 입력창을 비우고 새로운 글 작성 모드로 전환 */
        function newItem() {
            currentIndex = null;
            document.getElementById('titleInput').value = '';
            document.getElementById('contentInput').value = '';
            document.getElementById('titleInput').focus();
        }
        /* [메모 선택 함수] 좌측 목록에서 특정 메모를 클릭했을 때 에디터에 내용 불러오기 */
        function selectNote(index) {
            currentIndex = index;
            document.getElementById('titleInput').value = notes[index].title;
            document.getElementById('contentInput').value = notes[index].content;
        }
        /* [저장 함수] 현재 작성 중인 내용을 캐시(LocalStorage)에 임시 저장 */
        function saveNote() {
            const title = document.getElementById('titleInput').value;
            const content = document.getElementById('contentInput').value;
            if (!title && !content) return alert('내용을 입력해주세요.');
            if (currentIndex === null) {
                notes.push({ title, content });
                currentIndex = notes.length - 1;
            } else {
                notes[currentIndex] = { title, content };
            }
            localStorage.setItem('web_notes', JSON.stringify(notes));
            renderList();
            alert('저장되었습니다!');
        }
        /* [파일 다운로드 함수] 작성한 내용을 PC에 .txt 파일로 저장 */
        function downloadTxtFile() {
            const title = document.getElementById('titleInput').value.trim() || '제목없음';
            const content = document.getElementById('contentInput').value;
            if (!content) return alert('저장할 내용이 없습니다.');
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `${title}.txt`;
            link.click();
            URL.revokeObjectURL(link.href);
        }
        /* [창 닫기 함수] 브라우저 창을 닫음 */
        function closeWindow() {
            if (confirm('메모장을 닫으시겠습니까?')) {
                window.close();
                setTimeout(() => {
                    alert('브라우저 보안 정책에 의해 창이 자동으로 닫히지 않는 경우 직접 탭을 닫아주세요.');
                }, 100);
            }
        }
        /* [글자 크기 조절 함수] 입력창 폰트 크기 변경 */
        function changeFontSize(step) {
            currentFontSize += step;
            if (currentFontSize < 10) currentFontSize = 10;
            if (currentFontSize > 40) currentFontSize = 40;
            applyFontSize();
        }
        /* [글자 크기 초기화 함수] 폰트 크기를 기본값(16px)으로 복원 */
        function resetFontSize() {
            currentFontSize = 16;
            applyFontSize();
        }
        /* [폰트 크기 적용 함수] 변경된 글자 크기를 제목/내용 입력창에 반영 */
        function applyFontSize() {
            document.getElementById('titleInput').style.fontSize = currentFontSize + 'px';
            document.getElementById('contentInput').style.fontSize = currentFontSize + 'px';
        }
        /* [초기 실행] 페이지 최초 로딩 시 목록 렌더링 수행 */
        renderList();
    </script>
</body>
</html>
