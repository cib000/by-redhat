<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>타이틀 수정</title>
	<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2299%22>📆</text></svg>">
    <style>
        /* 기본 스타일 */
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;			
            margin: 0;
        }

        .wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
			padding: 10px;
        }

        .header-area {
            margin-bottom: 20px;
        }

        .header-area h3 {
            margin: 0;
            color: #1f2937;
        }

        /* 팝업(새 창) 배경 역할 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        /* 모달 박스 */
        .modal-container {
            background-color: white;
            padding: 24px;
			margin: 20px;
            border-radius: 12px;
            width: 100%;
            /* max-width: 400px;  /*  */
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            margin: 0;
            font-size: 18px;
            color: #1f2937;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #9ca3af;
        }

        .close-btn:hover {
            color: #4b5563;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            color: #4b5563;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            font-size: 15px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            outline: none;
        }

        .form-group input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
			margin-top: 100px;
        }

        .btn {
            padding: 8px 16px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            border: none;
        }

        .btn-cancel {
            background-color: #f3f4f6;
            color: #4b5563;
        }

        .btn-cancel:hover {
            background-color: #e5e7eb;
        }

        .btn-save {
            background-color: #4f46e5;
            color: white;
        }

        .btn-save:hover {
            background-color: #4338ca;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="header-area">
            <h3>✨ 일정 달력 : 제목 수정 ✍편집기</h3>        
        </div>
    
        <!-- 모달 영역 (새 창에서는 항상 띄워져 있도록 active 클래스 부여) -->
        <div class="modal-overlay active" id="modalOverlay">
            <div class="modal-container" id="modalContainer">
                <div class="modal-header">
                    <h3>캘린더 타이틀 수정</h3>
                    <button class="close-btn" id="closeModalBtn">&times;</button>
                </div>
                
                <div class="form-group">
                    <label for="titleInput">현재 설정된 제목</label>
                    <input type="text" id="titleInput" value="일정 달력  📆">
                </div>
                
                <div class="modal-footer">
                    <button class="btn btn-cancel" id="cancelBtn">취소</button>
                    <button class="btn btn-save" id="saveBtn">저장 (파일 다운로드)</button>
                    <button class="btn btn-cancel" id="closeWindowBtn">창닫기</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // 원본 데이터 객체
        const titleData = {
            "calendarTitle": "일정 달력  📆"
        };

        const closeModalBtn = document.getElementById('closeModalBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const closeWindowBtn = document.getElementById('closeWindowBtn');
        const saveBtn = document.getElementById('saveBtn');
        const titleInput = document.getElementById('titleInput');

        // 창 닫기 공통 함수 (window.open으로 열린 창을 닫음)
        const closeWindow = () => {
            window.close();
        };

        // 닫기(X), 취소, 창닫기 버튼 클릭 시 창 닫기
        closeModalBtn.addEventListener('click', closeWindow);
        cancelBtn.addEventListener('click', closeWindow);
        closeWindowBtn.addEventListener('click', closeWindow);

        // 저장 버튼 클릭 시 (title.js 형식으로 파일 다운로드 후 창 닫기)
        saveBtn.addEventListener('click', () => {
            // 입력값 반영
            titleData.calendarTitle = titleInput.value;

            // 파일 내용 생성
            const fileContent = `const titleData = {\n  "calendarTitle": "${titleData.calendarTitle}"\n};`;
            
            // Blob 생성 및 다운로드 링크 연결
            const blob = new Blob([fileContent], { type: 'text/javascript;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'title.js';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            alert('수정된 내용이 title.js 파일로 저장되었습니다.');
            closeWindow();
        });
    </script>
</body>
</html>
