<!DOCTYPE html>
<html lang="ko">

  <head>
    <meta charset="UTF-8">
    <title>음악듣기</title>
	<link rel="icon" type="image/x-icon" href="./asets/imgs/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="./asets/style.css">
  </head>
    
  <body>

  <!-- 로컬 폴더 선택 컨트롤 영역 -->
  <div class="folder-select-bar">
    <label style="margin-right: 15px; cursor: pointer; font-size: 1.1rem; color:#E0E0E0; ">
      <input type="checkbox" id="includeSubfolders" checked style="transform: scale(1.2);"> 하위 폴더 포함
    </label>
    <button onclick="document.getElementById('folderInput').click()" >
      📁 로컬 사운드 폴더 선택
    </button>
    <input type="file" id="folderInput" webkitdirectory directory multiple style="display:none;">
  </div>

<section class=player id=player aria-label="Music player" v-cloak>

  <transition-group tag=div class=transition_cover :name=transitionName>
    <div class=cover
         v-for="(track, index) in tracks" :key="index"
		 v-if="currentTrack && index === currentTrackIndex"
         :key="$index + 0">
      <div class=cover_copy role=alert>
        <h3 class=cover_title>{{ currentTrack.title }}</h3>
      </div>
    </div>
  </transition-group>

  <!-- 폴더를 아직 선택하지 않았을 때의 안내 문구 -->
  <div v-if="tracks.length === 0" style="text-align: center; padding: 40px 0; font-size: 1.2rem;">
    위의 버튼을 눌러 MP3 폴더를 선택해주세요.
  </div>

  <div class=controls-volume v-if="tracks.length > 0">
    
	<span class=btn_wrap>
      <button class=btn-play ref=btnPlay @click=playTrack style="font-size: 4.4rem; margin-left:-200px; margin-bottom:5px; border: none; background: none; cursor: pointer;">
        <span class=-sr-only>{{isTimerPlaying ? 'Pause' : 'Play'}}</span>
        <span>{{ isTimerPlaying ? '❚❚' : '▶' }}</span>
      </button>
    </span>
	
	<div class=volume>
      <span class=btn_wrap>
        <button class=btn-mute ref=btnMute @click=muteTrack style="font-size: 2.1rem; border: none; background: none; cursor: pointer;">
          <span class=-sr-only>{{isMuted ? 'Muted' : 'Mute'}}</span>
          <span>{{ isMuted ? '🔇' : '🔊' }}</span>
        </button>
      </span>
      <label class=-sr-only aria-hidden=true for=vol_range>Volume</label>
      <input class=range_input id=vol_range type=range
             min=0 max=100 step=0.1 value=50 aria-label=Volume ref=volRange @input=volRange >
    </div>    

  </div>

  <div class=controls-track style="margin-top:0px;" v-if="tracks.length > 0">
    <span class=btn_wrap>
      <button class=btn-prev ref=btnPrev @click=prevTrack>
        <span class=-sr-only>Previous</span>
        <span>◀◀</span>
      </button>
    </span>

    <div class=progress>
      <div class=progress_duration aria-hidden=true>{{ duration }}</div>
      <label class=progress_bar for=progBar>
        <span class=-sr-only>Track progress {{ barWidth }}%</span>

        <progress id=progBar class=progress_current
                  max=100 aria-hidden=true
                  :value=barWidth
                  ref=progress @click=progressTrack></progress>
      </label>
      <div class=progress_time aria-hidden=true>{{ currentTime }}</div>
    </div>

    <span class=btn_wrap>
      <button class=btn-next ref=btnNext @click=nextTrack>
        <span class=-sr-only>Next</span>
        <span>▶▶</span>
      </button>
    </span>

  </div>



	<!-- 플로팅 버튼 바 (전체화면 / 목록보기) -->
    <div class="floating-bar">
      <button type="button" class="float-btn" @click="toggleFullScreen">
        {{ isFullScreen ? '🗗 창모드' : '⛶ 전체화면' }}
      </button>

      <button type="button" class="float-btn" @click="showListModal = true">
        📋 목록보기
      </button>
    </div>

    <!-- 목록보기 모달 -->
    <div class="modal-overlay" v-if="showListModal" @click.self="showListModal = false">
      <div class="modal-content">
        <div class="modal-header">
          <h3>재생 목록 (총  {{ tracks.length }}  개 항목)</h3>
          <button type="button" class="close-btn" @click="showListModal = false">✕</button>
        </div>
        <ul class="track-list">
          <li v-for="(track, index) in tracks" :key="index" :class="{ active: index === currentTrackIndex }" @click="selectTrack(index)">
            <span class="track-num">{{ index + 1 }}</span>
            <span class="track-title">{{ track.title }}</span>
          </li>
        </ul>
      </div>
    </div>


<!-- ******************************************************************* -->
	<!-- 플레이어 바로 옆에 위치할 1:1 비디오 패널 --><!--
	<div class="video-panel" v-show="isVideoVisible">
	  <div class="video-wrapper">
		<video ref="bgVideo" autoplay loop muted playsinline 
			   src="./bgvod.mp4" 
			   @error="onVideoError" 
			   @loadeddata="isVideoVisible = true">
		</video>
	  </div>
	  
	  <!-- 영상 아래 컨트롤 (투명도 & 볼륨) --><!--
	  <div class="video-controls">
		<div class="v-control-group">
		  <label>투명도</label>
		  <input type="range" min="0" max="1" step="0.01" v-model="videoOpacity" @input="updateVideoStyle">
		</div>
		<div class="v-control-group">
		  <label>볼륨</label>
		  <input type="range" min="0" max="1" step="0.01" v-model="videoVolume" @input="updateVideoStyle">
		</div>
	  </div>
	</div>
<!-- ******************************************************************* -->


</section>

<!-- 왼쪽 하단 실시간 일시 표시 영역 -->
<!--

  2026년 7월 22일 수 오전 9시 36분
</div>
-->

<!-- 왼쪽 하단 실시간 일시 표시 영역 -->
<!--
<div class="current-datetime">
  {{ currentTime }}
</div>  -->

<div id="current-clock" class="current-datetime"></div>

    <script src='./asets/vue.min.js'></script>
    <script src="./asets/script.js"></script>

  </body>
  
</html>
