<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice QR Code Generator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-center items-center p-4">

    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 p-6 w-full max-w-md">
        <div class="flex items-center space-x-3 mb-5">
            <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-lg">
                <i class="fa-solid fa-microphone-lines text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg">음성 QR 코드 생성기</h1>
                <p class="text-xs text-slate-500">긴 문장도 안정적으로 생성됩니다</p>
            </div>
        </div>

        <div class="mb-4">
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">읽어줄 문장 입력</label>
            <textarea id="ttsText" rows="4" class="w-full p-3 border border-slate-300 rounded-xl bg-slate-50 focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">긴급 구조를 요청합니다. 나는 홍길동입니다. 도와주세요.</textarea>
            <div class="text-right text-xs text-slate-400 mt-1" id="charCount">0자</div>
        </div>

        <button onclick="generateQR()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl shadow-lg transition duration-200 flex items-center justify-center gap-2 mb-6">
            <i class="fa-solid fa-qrcode"></i> QR 코드 생성하기
        </button>

        <!-- QR Display Area -->
        <div class="bg-slate-50 rounded-xl border border-slate-200 p-6 flex flex-col items-center justify-center min-h-[220px]">
            <!-- Canvas를 활용한 안정적인 QR 렌더링 컨테이너 -->
            <div id="qrcode" class="bg-white p-3 rounded-xl shadow-sm inline-block flex items-center justify-center">
                <span class="text-xs text-slate-400">문장을 입력하고 생성 버튼을 누르세요</span>
            </div>
            <div id="statusText" class="mt-3 text-xs text-slate-500">스마트폰으로 스캔하면 텍스트가 바로 재생됩니다.</div>
        </div>
    </div>

    <!-- qrious QR 라이브러리 사용 (캔버스 기반으로 용량 초과 에러가 적음) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <script>
        const textarea = document.getElementById('ttsText');
        const charCount = document.getElementById('charCount');

        function updateCount() {
            charCount.textContent = `${textarea.value.length}자`;
        }
        textarea.addEventListener('input', updateCount);
        updateCount();

        function generateQR() {
            const text = textarea.value.trim();
            if (!text) {
                alert('문장을 입력해주세요.');
                return;
            }

            const container = document.getElementById('qrcode');
            container.innerHTML = '';

            // 1. 스캔 시 브라우저에서 바로 음성을 읽어주도록 HTML 뷰어 형태의 데이터 URL 구조 압축 생성
            const payload = `data:text/html;charset=utf-8,` + encodeURIComponent(`<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Voice QR</title></head><body style="font-family:sans-serif;text-align:center;padding:40px;background:#f8fafc"><div style="background:white;padding:30px;border-radius:16px;box-shadow:0 10px 25px rgba(0,0,0,0.08);max-width:350px;margin:auto"><h2 style="color:#2563eb;margin-top:0">🔊 음성 안내</h2><p style="font-size:16px;line-height:1.6;color:#334155">${text}</p><button onclick="window.speechSynthesis.speak(new SpeechSynthesisUtterance('${text.replace(/'/g, "\\'")}'))" style="background:#2563eb;color:white;border:none;padding:12px 24px;border-radius:8px;font-weight:600;cursor:pointer;width:100%;margin-top:10px">다시 듣기</button></div><script>window.onload=function(){setTimeout(()=>{window.speechSynthesis.speak(new SpeechSynthesisUtterance('${text.replace(/'/g, "\\'")}'));}, 300);}<\/script></body></html>`);

            try {
                // 2. QRious 캔버스 기반 QR 생성 (용량 및 크기 자동 최적화)
                const canvas = document.createElement('canvas');
                container.appendChild(canvas);
                
                new QRious({
                    element: canvas,
                    value: payload,
                    size: 200,
                    level: 'L' // Low 레벨로 설정하여 긴 텍스트 수용력 최대화
                });

                document.getElementById('statusText').textContent = 'QR 코드가 성공적으로 생성되었습니다!';
            } catch (err) {
                console.error(err);
                // 3. 만약 그래도 초과할 경우 텍스트 전용 압축 포맷으로 대체 실행
                try {
                    container.innerHTML = '';
                    const canvas2 = document.createElement('canvas');
                    container.appendChild(canvas2);
                    new QRious({
                        element: canvas2,
                        value: text,
                        size: 200,
                        level: 'L'
                    });
                    document.getElementById('statusText').textContent = '텍스트 전용 모드로 생성되었습니다.';
                } catch(e) {
                    alert('문장이 너무 길어 생성에 실패했습니다. 내용을 조금만 줄여주세요.');
                }
            }
        }
    </script>
</body>
</html>
