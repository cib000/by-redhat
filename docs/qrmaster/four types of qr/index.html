<!DOCTYPE html>
<html lang="ko" class="dark"> <!-- 시작 시 기본 다크 모드 적용을 위해 class="dark" 추가 -->

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR 코드 만들기</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx='50' cy='70' r='70' /><text y=%22.9em%22 font-size=%2299%22>🎯</text></svg>">
  
  <style>
    /* 기본 다크 테마 변수 설정 */
    :root {
	  --bg-color: #C1ABA7;
	  --text-color: #000;
	  --border-color: #0ff;
	  --card: #0b1220;
      --muted: #94a3b8;
      --accent: #ffb300;
      --bg: #0f1724;
      --container-bg: linear-gradient(180deg, #071024 0%, #081426 100%);
      --text-color: #e6eef8;
      --control-bg: rgba(255,255,255,0.03);
      --border-color: rgba(255,255,255,0.06);
      --preview-bg: rgba(0,0,0,0.35);
    }


    /* 라이트 테마 변수 설정 (html에 light 클래스가 붙을 때 적용) */
    html.light {
      --card: #ffffff;
      --muted: #64748b;
      --accent: #d97706;
      --bg: #f1f5f9;
      --container-bg: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      --text-color: #0f172a;
      --control-bg: rgba(0,0,0,0.03);
      --border-color: rgba(0,0,0,0.1);
      --preview-bg: rgba(0,0,0,0.05);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, Arial, sans-serif;
      background: var(--bg);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      padding: 28px;
      transition: background 0.3s, color 0.3s;
    }
    .container {
      width: 100%;
      max-width: 1100px;
      background: var(--container-bg);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 8px 30px rgba(2,6,23,0.15);
      transition: background 0.3s;
    }
    
    /* 상단 헤더 및 테마 버튼 레이아웃 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    header h1 { margin: 0; font-size: 28px; color: var(--accent); cursor: pointer; }
    header h1 a { color: inherit; text-decoration: none; }
    
    /* 테마 전환 버튼 스타일 */
    #themeToggleBtn {
      background: var(--control-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    #themeToggleBtn:hover {
      background: var(--accent);
      color: #081426;
      border-color: var(--accent);
    }

    main { display: flex; gap: 18px; flex-wrap: wrap; }
    .controls {
      flex: 1 1 450px;
      background: var(--control-bg);
      padding: 14px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }
    .controls label { display: block; margin-bottom: 12px; font-size: 14px; color: var(--muted); }
    .controls input[type="text"], 
    .controls input[type="url"], 
    .controls input[type="file"], 
    .controls select, 
    .controls input[type="color"] {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: transparent;
      color: inherit;
    }
    
    .color-input-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 5px;
    }
    .color-input-wrapper input[type="color"] {
      flex: 1;
      height: 40px;
      padding: 2px;
      cursor: pointer;
    }

    .row { display: flex; gap: 8px; }
    .row label { flex: 1; }

    /* 버튼 균등 분할 */
    .buttons {
      display: flex;
      gap: 10px;
      width: 100%;
      margin-top: 8px;
    }
    .buttons button {
      flex: 1;
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      cursor: pointer;
    }
    #generateBtn { background: var(--accent); color: #081426; }
    #downloadBtn { background: #06b6d4; color: #04111a; }
    button.ghost { background: transparent; border: 1px solid var(--border-color); color: var(--muted); }

    .preview {
      flex: 1 1 300px;
      background: var(--control-bg);
      padding: 14px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      min-height: 380px;
    }
    .preview h3 { margin: 0 0 8px; color: var(--muted); }
    #previewArea {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 300px;
      background: var(--preview-bg);
      border-radius: 8px;
      padding: 12px;
    }
    #previewArea canvas, #previewArea svg, #previewArea img { max-width: 100%; max-height: 100%; border-radius: 8px; }
    footer { margin-top: 14px; text-align: right; color: var(--muted); }

    #dataInput {
      width: 100%;
      height: 120px;
      resize: vertical;
      margin-top: 5px;
    }
	
	hr {
		margin-bottom: 15px;
	}

    .color-preview {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
    }
  </style>

  <!-- 초기 로딩 시 깜빡임 방지 및 저장된 테마 적용 스크립트 -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme');
      // 저장된 테마가 없으면 기본값인 'dark'로 설정, 있으면 그 값 사용
      if (savedTheme === 'light') {
        document.documentElement.classList.remove('dark');
        document.documentElement.classList.add('light');
      } else {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>

<body>
  <div class="container">
    <header>
      <h1><a onclick="location.reload();">QR 코드 만들기</a></h1>
      <button id="themeToggleBtn">☀️ 라이트 모드</button>
    </header>

    <main>
      <section class="controls">
        
		<!-- 입력 형식 선택 라디오 버튼 추가 -->
        <label>입력 형식 선택:</label>
        <div class="radio-group" style="display: flex; gap: 15px; margin-bottom: 12px; font-size: 14px; color: var(--text-color);">
          <label style="cursor: pointer;"><input type="radio" name="qrTypeMode" value="url"> 웹주소</label>
          <label style="cursor: pointer;"><input type="radio" name="qrTypeMode" value="text" checked> 텍스트</label>
          <label style="cursor: pointer;"><input type="radio" name="qrTypeMode" value="tel"> 전화</label>
          <label style="cursor: pointer;"><input type="radio" name="qrTypeMode" value="sms"> 문자</label>
		</div>
		
		
		
		<label style="display:none;">타입선택:
          <select id="codeType">
            <option value="qr">QR Code (Standard)</option>
            <option value="datamatrix">DataMatrix</option>
            <option value="pdf417">PDF417</option>
            <option value="aztec">Aztec</option>
            <option value="code128">Code 128 (1D)</option>
            <option value="ean13">EAN-13 (1D)</option>
            <option value="upc">UPC-A (1D)</option>
          </select>
        </label>
		
		<hr>
		
        <label>플랫폼 선택 (선택사항 프리셋):
          <select id="platform">
            <option value="">-- 사용자 지정 / 직접 URL/텍스트 --</option>
            <option value="https://wa.me/">앱스토어</option>
            <option value="https://instagram.com/">인스타그램</option>
            <option value="https://youtube.com/">유튜브</option>
            <option value="https://twitter.com/">트위터 (X)</option>
            <option value="https://facebook.com/">페이스북</option>
          </select>
        </label>

		<hr>


        <!-- 웹주소/텍스트/전화용 레이블과 textarea -->
		<label id="singleInputLabel">입력 (웹주소 / 텍스트 / 전화번호):
		  <textarea id="dataInput" placeholder="웹주소를 입력하세요 (예: example.com 또는 https://...)"></textarea>
		</label>

		<!-- 문자 전용 입력 컨테이너 (이 id가 반드시 있어야 합니다!) -->
		<div id="smsInputsContainer" style="display: none; margin-bottom: 12px;">
		  <label>수신할 전화번호:
			<input type="text" id="smsPhone" placeholder="예: 010-1234-5678" style="margin-bottom: 8px;" />
		  </label>
		  
		  <label>보낼 문자 내용:
			<br>
			<textarea id="smsMessage" placeholder="전송할 문자 내용을 입력하세요." style="width:100%; height: 100px; resize: vertical;"></textarea>
		  </label>
		</div>
		
		<hr>

        <div class="row">
          <label>표시 색상:
            <div class="color-input-wrapper">
              <input type="color" id="primaryColor" value="#000000" />
              <span class="color-preview" id="primaryColorPreview" style="background-color: #000000;"></span>
            </div>
          </label>
          
          <label>배경색:
            <div class="color-input-wrapper">
              <input type="color" id="bgColor" value="#fff" />
              <span class="color-preview" id="bgColorPreview" style="background-color: #fff;"></span>
            </div>
          </label>
        </div>
		
		<hr>

        <label id="qrStyleWrap">QR 구성 모양:
          <select id="qrStyle">
            <option value="square">정사각형(기본형)</option>
            <option value="dots">점</option>
            <option value="rounded">둥근</option>
            <option value="extra-rounded">매우 둥근</option>
          </select>
        </label>
		
		<hr>

        <label>중앙 로고 / 업로드 (QR 전용):
          <input type="file" id="logoFile" accept="image/*" />
        </label>
		
		<hr>

        <div class="buttons">
          <button id="generateBtn">큐알 이미지 생성</button>
          <button id="downloadBtn" disabled>큐알 이미지 다운로드</button>
          <button id="clearBtn" class="ghost">초기화</button>
        </div>
		
      </section>

      <section class="preview">
        <h3>미리보기</h3>
        <div id="previewArea"></div>
      </section>
    </main>

    <footer>
      <small>❤️ — 강릉 키오스크 (Gangneung KIOSK) - WAF</small>
    </footer>
  </div>



  
	<!-- 다운로드 설정 커스텀 모달 창 -->
	<div id="downloadModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.96); z-index: 1000; justify-content: center; align-items: center;">
	  <div style="background: var(--card-bg, #630E26); padding: 24px; border-radius: 12px; width: 340px; box-shadow: 0 8px 24px rgba(0,0,0,0.25); color: var(--text-color, #000); border: 1px solid var(--border-color, #ddd);">
		<h3 style="margin-top: 0; margin-bottom: 16px; font-size: 18px; font-weight: 600;">다운로드 옵션 설정</h3>
		
		<label style="display: block; margin-bottom: 12px; font-size: 14px;">
		  파일 이름:
		  <input type="text" id="modalFileName" placeholder="예: my_qr_code" style="width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; background: var(--bg-color, #f9f9f9); color: var(--text-color, #333); border: 1px solid var(--border-color, #ccc); border-radius: 4px;" />
		</label>

		<label style="display: block; margin-bottom: 12px; font-size: 14px;">
		  이미지 크기 (정사각형):
		  <select id="modalImageSize" style="width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; background: var(--bg-color, #f9f9f9); color: var(--text-color, #333); border: 1px solid var(--border-color, #ccc); border-radius: 4px;">
			<option value="100">100 x 100 px</option>
			<option value="150">150 x 150 px</option>
			<option value="200">200 x 200 px</option>
			<option value="250" selected>250 x 250 px</option>
			<option value="300">300 x 300 px</option>
			<option value="350">350 x 350 px</option>
			<option value="400">400 x 400 px</option>
			<option value="450">450 x 450 px</option>
			<option value="500">500 x 500 px</option>
		  </select>
		</label>

		<!-- 하단 문구 선택 셀렉트박스 추가 -->
		<label style="display: block; margin-bottom: 12px; font-size: 14px;">
		  하단 문구 선택:
		  <select id="modalBottomText" style="width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; background: var(--bg-color, #f9f9f9); color: var(--text-color, #333); border: 1px solid var(--border-color, #ccc); border-radius: 4px;">
			<option value="">없음 (문구 안 함)</option>
			<option value="나를 스캔해 주세요" selected>나를 스캔해 주세요</option>
			<option value="나를 스캔하세요">나를 스캔하세요</option>
			<option value="응급구조시 확인사항">응급구조시 확인사항</option>
		  </select>
		</label>

		<label style="display: block; margin-bottom: 20px; font-size: 14px;">
		  확장자 선택:
		  <select id="modalFileExt" style="width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; background: var(--bg-color, #f9f9f9); color: var(--text-color, #333); border: 1px solid var(--border-color, #ccc); border-radius: 4px;">
			<option value="jpg" selected>JPG (기본값)</option>
			<option value="png">PNG</option>
			<option value="bmp">BMP</option>
			<option value="gif">GIF</option>
			<option value="svg">SVG</option>
		  </select>
		</label>

		<div style="display: flex; gap: 8px; justify-content: flex-end;">
		  <button id="modalCancelBtn" style="padding: 8px 14px; background: var(--bg-color, #e0e0e0); color: var(--text-color, #333); border: 1px solid var(--border-color, #ccc); border-radius: 4px; cursor: pointer;">취소</button>
		  <button id="modalConfirmBtn" style="padding: 8px 14px; background: #007bff; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: 600;">다운로드</button>
		</div>
	  </div>
	</div>




  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.6.0/lib/qr-code-styling.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script src="https://unpkg.com/bwip-js/dist/bwip-js-min.js"></script>

  <!-- Your script -->
  <script src="./script.js"></script>

  <script>
    // 1. 색상 미리보기 기능
    const primaryColorInput = document.getElementById('primaryColor');
    const primaryColorPreview = document.getElementById('primaryColorPreview');
    primaryColorInput.addEventListener('input', (e) => {
      primaryColorPreview.style.backgroundColor = e.target.value;
    });

    const bgColorInput = document.getElementById('bgColor');
    const bgColorPreview = document.getElementById('bgColorPreview');
    bgColorInput.addEventListener('input', (e) => {
      bgColorPreview.style.backgroundColor = e.target.value;
    });

    // 2. 다크/라이트 테마 전환 기능
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    
    // 버튼 초기 텍스트 설정
    function updateButtonText() {
      if (document.documentElement.classList.contains('dark')) {
        themeToggleBtn.textContent = '☀️ 라이트 모드';
      } else {
        themeToggleBtn.textContent = '🌙 다크 모드';
      }
    }
    updateButtonText();

    themeToggleBtn.addEventListener('click', () => {
      const htmlEl = document.documentElement;
      if (htmlEl.classList.contains('dark')) {
        htmlEl.classList.remove('dark');
        htmlEl.classList.add('light');
        localStorage.setItem('theme', 'light');
      } else {
        htmlEl.classList.remove('light');
        htmlEl.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      }
      updateButtonText();
    });
  </script>
</body>
</html>
