  <script src="./feednami-client-v1.1.js"></script>

  <script>
	const rssSelect = document.getElementById("rssSelect");
	const fileInput = document.getElementById("fileInput");
	const rssResult = document.getElementById("rssResult");
	const rssFeed = document.getElementById("rss-feed");
	const loadingText = document.getElementById("loading");


document.getElementById("copybtn").addEventListener("click", function() {
  const copyText = document.getElementById("rssResult").textContent;

  if (!copyText) {
    alert("복사할 RSS 주소가 없습니다.");
    return;
  }

  navigator.clipboard.writeText(copyText)
    .then(() => {
      // alert("RSS 주소가 복사되었습니다: " + copyText);
    })
    .catch(err => {
      console.error("복사 실패: ", err);
    });
});



function loadRss(rssUrl) {

  const selectedText = rssSelect.options[rssSelect.selectedIndex].text;
  rssFeed.innerHTML = "";
  rssResult.textContent = "";
  if (!rssUrl) return;
  rssResult.textContent = rssUrl;
  
  loadingText.style.display = "flex";

  feednami.load(rssUrl)
    .then(feed => {
      feed.entries.forEach(entry => {
        const li = document.createElement("li");
        const a = document.createElement("a");
        const dateSpan = document.createElement("span");
        const authorSpan = document.createElement("span");

        a.href = entry.link;
        a.textContent = entry.title;
        a.target = "_blank";

        if (entry.publishedDate) {
          const date = new Date(entry.publishedDate);
          dateSpan.textContent = " (" + date.toLocaleDateString() + ")";
          dateSpan.className = "date";
        }

        if (entry.author) {
          authorSpan.textContent = " 글쓴이 : " + entry.author;
		  authorSpan.className = "author";
		  //authorSpan.style.color = "#00f"; // 👈 이 줄을 추가하여 원하는 색상 코드를 적어줍니다.
          authorSpan.className = "author";
        }

        li.appendChild(a);
        li.appendChild(dateSpan);
        li.appendChild(authorSpan);
        
        rssFeed.appendChild(li);
      });
    })
    .catch(error => {
      console.error(error);
      rssFeed.innerHTML = `
		  <li>뉴스를 불러오지 못했습니다.</li>
		  <li class="error-box">
			<img src="error.svg">
		  </li>
		`;
    })
    .finally(() => {
      loadingText.style.display = "none";
    });
}



  </script>
