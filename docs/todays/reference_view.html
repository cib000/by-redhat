<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<title>기본 참고 목록 보기</title>

	<link rel="stylesheet" href="./styles_m1.css">
</head>

<body>
<h1>기본 참고 목록 보기</h1>

<div class="Listbox">
<ul id="fileList"></ul>
</div>

<script>
  // 지정 폴더 (서버 환경에서만 동작 가능)
  const folder = './autoit/reference/'; // HTML 파일들이 들어있는 폴더
  const files = ['Language Reference - Operators.html',
	'Language Reference.html',
	'Language Reference - Loops Statements.html',
	'Language Reference - Datatypes.html',
	'Keyword RequireAdmin.html',
	'Function IsAdmin.html',
	'Keyword pragma.html',
	'Keyword OnAutoItStartRegister.html',
	'Function OnAutoItExitRegister.html',
	'Function OnAutoItExitUnRegister.html',
	'Language Reference - Variables.html',
	'Keyword NoTrayIcon.html',
	'Keyword include-once.html',
	'Keyword include.html',
	'Keyword comments-start.html',
	'Language Reference - Directives.html',
	'Language Reference - Conditional Statements.html',
	'User Defined Functions.html',
	'Functions.html',
	'GUI control styles.html',
	'AutoIt Constants include files.html',
	'Function AutoItSetOption.html',
	'Macros.html'
	]; // 실제 파일명 배열 예제
  const ul = document.getElementById('fileList');

  files.forEach(file => {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = folder + file;
    a.target = '_blank'; // 새 창에서 열기
    a.textContent = file;
    li.appendChild(a);
    ul.appendChild(li);
  });
</script>
</body>
</html>
