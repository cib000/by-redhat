<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>코드 지원 템플릿 제작</title>
	<link rel="shortcut icon" href="tool.ico" >
	
    <link rel="stylesheet" href="https://stackedit.io/style.css" />
    <style>
        body {
            background-image: url('./imgs/bg.webp');
			background-repeat: no-repeat;
			background-attachment: fixed;
			background-size: cover;
			font-family: Arial, sans-serif;
            padding: 20px;
            margin: 0;
            background-color: #f5f5f5;
        }
        .container {
            display: flex;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .left, .right {
            width: 50%;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        .right {
            overflow-y: auto;
            max-height: 90vh;
        }
        textarea {
            width: 100%;
            min-height: 500px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: Consolas, monospace;
            font-size: 14px;
            resize: vertical;
            box-sizing: border-box;
        }
        .button-container {
            margin-top: 15px;
            text-align: center;
        }
        button {
            padding: 10px 20px;
            margin: 0 8px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        #addCodeBtn {
            background-color: #007bff;
            color: white;
        }
		#pasteCodeBtn {
		    background-color: #4FA833;
            color: white;
		}
		
        #saveCodeBtn {
            background-color: #28a745;
            color: white;
            font-weight: bold;
            padding: 12px 30px;
            font-size: 16px;
        }
		#refreshScrBtn {
			background: #00f;
			color: #fff;
			border-radius: inherit;
			font-weight: bold;
            padding: 12px 30px;
            font-size: 16px;
		}		
		
        .code-box {
            position: relative;
            margin-bottom: 40px;
            padding-top: 50px;
        }
        .copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 10;
            background: #1565c0;
            color: white;
            padding: 6px 12px;
            font-size: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .discript {
            color: blue;
            font-weight: 900;
            border: 1px solid skyblue;
            border-radius: 10px;
            padding: 5px 20px;
            display: inline-block;
            margin-bottom: 10px;
        }
        .editable {
            background-color: #fafafa;
            border: 1px solid #ccc;
            border-radius: 5px;
            /* padding: 10px; */
            min-height: 20px;
            margin-top: 15px;
        }
		.stackedit__html {
			min-height: 10px;
		}
        hr {
            margin: 50px 0 30px 0;
            border: none;
            border-top: 2px solid #eee;
        }
		
		/* ************************************************ */

		@property --rotation {
		  syntax: '<angle>';
		  inherits: false;
		  initial-value: 0deg;
		}

		.gemini {
		  display: grid;  /*    */
		  width: 100px;
		  height: 30px;
		  padding: 2px 0;
		  margin: 0;
		  place-content: center;
		  color-scheme: light dark;
		  background: light-dark(#f5f5f5, black);
		  
		  --border-size: 4px;
		  --gradient: conic-gradient(from var(--rotation) at 52% 49% in oklab, oklch(0.63 0.2 251.22) 27%, oklch(0.67 0.21 25.81) 33%, oklch(0.9 0.19 93.93) 41%, oklch(0.79 0.25 150.49) 49%, oklch(0.63 0.2 251.22) 65%, oklch(0.72 0.21 150.89) 93%, oklch(0.63 0.2 251.22));
		  animation: rotate 5s infinite linear;
		  border-radius: 4rem;
		  background: none;
		  position: relative;
		  padding: 0;
		  border: 4px solid lightgray;

		  &::after {
			content: '';
			position: absolute;
			display: block;
			width: 100%;
			height: 100%;
			background: var(--gradient);
			top: 50%;
			left: 50%;
			translate: -50% -50%;
			z-index: -1;
			animation: rotate 5s infinite linear;
			filter: blur(15px);
		  }
		  
		  .inner {
			width: 100px;
		/*	height:25px;  */	
		/*	background: #ccc; /* light-dark(white, #1a1c1e); */
			color: #FFF; /* light-dark(#222, hsl(210, 8%, 66%)); */
			display: inline;
			padding: 0rem 0.0rem;
			margin-left: -10px;
			position: relative;
			z-index: 2;
			border-radius: inherit;
			display: grid;
			/* grid-template-columns: 1fr 250px 1fr; */
			align-items: center;
			gap: 0.0rem;
			font-family: system-ui;
		  }

		  .border {
			position: absolute;
			inset: calc(var(--border-size) * -1);
			mask: linear-gradient(white);
			border-radius: inherit;
			overflow: hidden;

			&::after {
			  content: '';
			  position: absolute;
			  width: 100%;
			  height: 100%;
			  background: var(--gradient);
			  top: 50%;
			  left: 50%;
			  translate: -50% -50%;
			  z-index: -1;
			  filter: blur(5px);
			}
		  }


		  button {
			width: 90px;  /*  */
			height: 24px;  /* 25px; inherit; */
			background: #fff; /* transparent;   none; */
			border-radius: inherit;
			cursor:pointer;
		  }
		
		/* ************************************************ */
		footer {
			position: fixed;
			display: block;
			width: 100%;
			height: 100px;
			bottom: 0;
			left: 5%;
			margin: 0 auto;
			
		}


    </style>
</head>
<body>
    <div class="container">
        <!-- 왼쪽: 입력 영역 -->
        <div class="left">
            <textarea id="inputCode" placeholder="오토잇 코드를 여기에 입력하세요..."></textarea>
            <div class="button-container">
                <button id="addCodeBtn">➕ 추가</button>
                <button id="pasteCodeBtn">🧾 붙여넣기</button>
            </div>
        </div>

        <!-- 오른쪽: 미리보기 영역 -->
        <div class="right">
            <div id="previewContent">
                <div class="stackedit__html">
                    <div id="dynamicContent"></div>
                </div>
            </div>

            <div class="button-container" style="margin-top: 10px; padding-top: 20px; border-top: 1px solid #eee;">
                <button id="saveCodeBtn">💾 저장 (HTML 파일 다운로드)</button>
				<button onClick="window.location.reload()" id="refreshScrBtn">🔄 화면 새로고침</button>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-autoit.min.js"></script>

    <script>
        // HTML 이스케이프
        function escapeHtml(text) {
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // 복사 함수 (미리보기 + 저장된 파일 모두 사용)
        function copyCode(btn) {
            const code = btn.parentElement.querySelector('code');
            const text = code.innerText;
            navigator.clipboard.writeText(text).then(() => {
                btn.textContent = "복사완료!";
                setTimeout(() => btn.textContent = "코드 내용복사", 1500);
            }).catch(() => alert("복사 실패"));
        }

        // 코드 추가
		document.getElementById('addCodeBtn').addEventListener('click', function() {
		const input = document.getElementById('inputCode').value.trim();
		if (!input) return;

		const container = document.getElementById('dynamicContent');

		const box = document.createElement('div');
		box.className = 'code-box';

		// 복사 버튼 - onclick 속성으로 직접 연결 (저장된 파일에서도 동작 보장)
		const copyBtn = document.createElement('button');
		copyBtn.className = 'copy-btn';
		copyBtn.textContent = '코드 내용복사';
		copyBtn.setAttribute('onclick', 'copyCode(this)');

		const pre = document.createElement('pre');
		const code = document.createElement('code');
		code.className = 'language-autoit';
		code.innerHTML = escapeHtml(input);
		pre.appendChild(code);

		const desc = document.createElement('div');
		desc.className = 'editable';
		desc.contentEditable = 'true';
		desc.innerHTML = '<span class="discript">코드 설명 :</span><br><br>';

		const hr = document.createElement('hr');

		box.appendChild(copyBtn);
		box.appendChild(pre);
		box.appendChild(desc);
		box.appendChild(hr);

		container.appendChild(box);

		document.getElementById('inputCode').value = '';
		document.querySelector('.right').scrollTop = document.querySelector('.right').scrollHeight;

		Prism.highlightAllUnder(container);
	});

        // 붙여넣기
        document.getElementById('pasteCodeBtn').addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                if (text.trim()) document.getElementById('inputCode').value = text;
            } catch (err) {
                alert('클립보드 읽기 실패');
            }
        });

        // 저장 기능 (핵심 수정: <\/script> 이스케이프 처리)
        document.getElementById('saveCodeBtn').addEventListener('click', function() {
            const dynamic = document.getElementById('dynamicContent');
            const addedHTML = dynamic.innerHTML || '<p style="text-align:center; color:#999;">아직 추가된 코드가 없습니다.</p>';

            const fullHTML = `<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오토잇  코드 템플릿 연구소</title>
	
    <link rel="stylesheet" href="https://stackedit.io/style.css" />
    <style>
        body { width:80vw; font-family: Arial, sans-serif; padding: 20px; background: #f9f9f9; margin:0 auto; 
		background-image: url('https://plus.unsplash.com/premium_photo-1661964187664-e26f70e1a224?fm=jpg&q=60&w=3000&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8JUVDJUJEJTk0JUVCJTk0JUE5JTIwJUVCJUIwJUIwJUVBJUIyJUJEfGVufDB8fDB8fHww');  
		background-repeat: no-repeat; 	background-attachment: fixed; 	background-size: cover;  }
        header {width: 80%; height: 100px; position: fixed; top:5px; text-align: center; display: flex; flex-direction: column; align-items: center; background: #BAE1FF; border: 2px solid red; border-radius: 4rem; z-index: 100;}
		section { margin-top: 130px; } 
		hr { margin: 50px 0 30px 0; border-top: 2px solid #f00; background: transparent; }
		h1 { color: #00F; margin-top: 1.2rem; letter-spacing : 2em;}
		h6 { color: #FFF; }
		footer { margin: 30px 5px; text-align: center;  align-items: center; }
		.code-box { background: #f9f9f9; position: relative; margin-bottom: 50px; padding: 20px; padding-top: 30px; font-weight:800; border-radius: 10px; opacity: 0.95;}
        .copy-btn {
            position: absolute; top: 50px; right: 30px; z-index: 10;
            background: #1565c0; color: white; padding: 6px 12px;
            font-size: 12px; border: none; border-radius: 4px; cursor: pointer;
        }
        .discript { color: blue; font-weight: 900; border: 1px solid skyblue; border-radius: 10px; padding: 5px 20px; display: inline-block; }
        .editable { background:#fafafa; border:1px solid #ccc; border-radius:5px; padding:10px; min-height:80px; margin-top:15px; }        
    </style>
</head>
<body class="stackedit">
<header>
<h1>연구과제</h1>
<hr>
</header>
<section>
    ${addedHTML}
</section>

<footer>
<h6>Dev team : KWAF - We Are Family</h6>
<br>
<button onclick="window.close()">창 닫기</button>	
</footer>

    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.js"><\/script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-autoit.min.js"><\/script>
    <script>
        function copyCode(btn) {
            const code = btn.parentElement.querySelector('code');
            const text = code.innerText;
            navigator.clipboard.writeText(text).then(() => {
                btn.textContent = "복사완료!";
                setTimeout(() => btn.textContent = "코드 내용복사", 1500);
            }).catch(() => alert("복사 실패"));

        document.addEventListener('DOMContentLoaded', () => Prism.highlightAll());
    <\/script>
</body>
</html>`;

            const blob = new Blob([fullHTML], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'autoit_code_discript_template.html';
            a.click();
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
