<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>10분 간격으로 이미지 변경</title>

<style>
  .mimg {
    text-align: center;
  }
</style>
</head>
<body>

<div class="mimg" id="mimg">
  <img id="image" src="./imgs/새해 복 많이 받으세요 2.gif" width="400px">
</div>

<script>
  // 이미지 URL 목록
  const images = [
    "./imgs/새해 복 많이 받으세요 2.gif",  // 첫 번째 이미지
    "./imgs/새해 복 많이 받으세요.gif",  // 두 번째 이미지
    "./imgs/복 배달중.gif"   // 세 번째 이미지
  ];

  let currentIndex = 0;  // 현재 이미지 인덱스

  // 이미지를 바꾸는 함수
  function changeImage() {
    // 이미지 요소 선택
    const imgElement = document.getElementById("image");

    // 배열에서 다음 이미지 선택
    currentIndex = (currentIndex + 1) % images.length;  // 0부터 순환
    imgElement.src = images[currentIndex];  // 이미지 경로 변경
  }

  // 10분(600,000ms)마다 이미지 변경
  setInterval(changeImage, 3000);  // 600,000ms = 10분

  // 페이지 로드 시 바로 첫 이미지 설정
  changeImage();
</script>

</body>
</html>
